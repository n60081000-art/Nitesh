<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>I Love You Ragini ❤️</title>  <style>  
*{  
    margin:0;  
    padding:0;  
    box-sizing:border-box;  
}  
  
body{  
    min-height:100vh;  
    overflow:hidden;  
    font-family:Arial, sans-serif;  
    background:radial-gradient(circle at center,#ffb6d9,#7b164b,#210018);  
    display:flex;  
    justify-content:center;  
    align-items:center;  
    color:white;  
}  
  
/* MAIN */  
.scene{  
    width:100%;  
    height:100vh;  
    position:relative;  
    display:flex;  
    justify-content:center;  
    align-items:center;  
}  
  
/* Door frame */  
.door-frame{  
    width:270px;  
    height:430px;  
    position:relative;  
    perspective:1000px;  
    z-index:10;  
}  
  
/* Door */  
.door{  
    position:absolute;  
    width:100%;  
    height:100%;  
    background:  
      linear-gradient(90deg,#4a071f,#8d174b,#4a071f);  
    border:10px solid #d9a441;  
    border-radius:8px;  
    transform-origin:left center;  
    transition:transform 2s ease-in-out;  
    box-shadow:0 0 35px #ff9bd0;  
    display:flex;  
    justify-content:center;  
    align-items:center;  
}  
  
.door.open{  
    transform:rotateY(-110deg);  
}  
  
.door-text{  
    font-size:28px;  
    font-weight:bold;  
    color:#ffd86b;  
    text-shadow:0 0 15px #fff;  
    text-align:center;  
}  
  
.knob{  
    position:absolute;  
    right:25px;  
    top:50%;  
    width:18px;  
    height:18px;  
    background:#ffd45c;  
    border-radius:50%;  
    box-shadow:0 0 15px gold;  
}  
  
/* Welcome */  
.message{  
    position:absolute;  
    text-align:center;  
    opacity:0;  
    transform:scale(.5);  
    transition:1.5s;  
    z-index:5;  
}  
  
.message.show{  
    opacity:1;  
    transform:scale(1);  
}  
  
.love{  
    font-size:38px;  
    font-weight:bold;  
    color:#fff;  
    text-shadow:  
       0 0 8px #ff69b4,  
       0 0 25px #ff1493;  
    animation:pulse 1.5s infinite;  
}  
  
.birthday{  
    margin-top:15px;  
    font-size:34px;  
    color:#ffd75e;  
    text-shadow:0 0 20px #ff9900;  
}  
  
@keyframes pulse{  
    50%{transform:scale(1.08);}  
}  
  
/* Cake */  
.cake-area{  
    margin-top:35px;  
}  
  
.cake{  
    width:180px;  
    height:95px;  
    background:#8b4513;  
    border-radius:12px 12px 25px 25px;  
    margin:auto;  
    position:relative;  
    box-shadow:0 10px 20px #0008;  
}  
  
.cream{  
    position:absolute;  
    top:-18px;  
    width:100%;  
    height:30px;  
    background:#fff1f7;  
    border-radius:50%;  
}  
  
.candle{  
    position:absolute;  
    width:10px;  
    height:45px;  
    background:#ff4f9a;  
    top:-60px;  
    left:50%;  
    transform:translateX(-50%);  
    border-radius:4px;  
}  
  
.flame{  
    position:absolute;  
    width:18px;  
    height:25px;  
    background:#ffd21f;  
    border-radius:50% 50% 50% 0;  
    transform:rotate(-45deg);  
    top:-24px;  
    left:-4px;  
    box-shadow:0 0 20px orange;  
    animation:flame .5s infinite alternate;  
}  
  
@keyframes flame{  
    to{transform:rotate(-45deg) scale(1.15);}  
}  
  
/* Cutting knife */  
.knife{  
    position:absolute;  
    width:95px;  
    height:7px;  
    background:silver;  
    top:45%;  
    left:50%;  
    opacity:0;  
    transform:translate(100px,-50%) rotate(-35deg);  
    transition:1s;  
}  
  
.knife.cut{  
    opacity:1;  
    animation:cut 2s ease-in-out;  
}  
  
@keyframes cut{  
    0%{transform:translate(100px,-50%) rotate(-35deg);}  
    50%{transform:translate(-45px,-50%) rotate(-35deg);}  
    100%{transform:translate(100px,-50%) rotate(-35deg);}  
}  
  
/* Button */  
.open-btn{  
    position:absolute;  
    bottom:35px;  
    z-index:20;  
    padding:14px 28px;  
    border:none;  
    border-radius:30px;  
    background:linear-gradient(45deg,#ff1493,#ff69b4);  
    color:white;  
    font-size:18px;  
    font-weight:bold;  
    box-shadow:0 0 20px #ff69b4;  
    cursor:pointer;  
}  
  
.open-btn:active{  
    transform:scale(.95);  
}  
  
/* Confetti */  
.confetti{  
    position:absolute;  
    width:8px;  
    height:15px;  
    top:-20px;  
    animation:fall linear forwards;  
}  
  
@keyframes fall{  
    to{  
        transform:translateY(110vh) rotate(720deg);  
    }  
}  
  
/* Floating hearts */  
.heart{  
    position:absolute;  
    font-size:25px;  
    animation:float 5s linear infinite;  
    opacity:.8;  
}  
  
@keyframes float{  
    from{  
        transform:translateY(100vh) scale(.5);  
        opacity:0;  
    }  
    20%{opacity:1;}  
    to{  
        transform:translateY(-10vh) scale(1.3);  
        opacity:0;  
    }  
}  
  
@media(max-width:500px){  
    .door-frame{  
        width:230px;  
        height:370px;  
    }  
  
    .love{  
        font-size:30px;  
    }  
  
    .birthday{  
        font-size:25px;  
    }  
  
    .cake{  
        width:150px;  
    }  
}  
</style>  </head>  <body>  <div class="scene">  <!-- Birthday Music -->  
<audio id="music" loop>  
    <source src="birthday.mp3" type="audio/mpeg">  
</audio>  

<!-- Birthday Message -->  
<div class="message" id="message">  

    <div class="love">  
        ❤️ I Love You Ragini ❤️  
    </div>  

    <div class="birthday">  
        🎉 HAPPY BIRTHDAY RAGINI 🎂  
    </div>  

    <div class="cake-area">  
        <div class="cake">  

            <div class="cream"></div>  

            <div class="candle">  
                <div class="flame"></div>  
            </div>  

        </div>  

        <div class="knife" id="knife"></div>  
    </div>  

</div>  

<!-- Door -->  
<div class="door-frame" id="doorFrame">  

    <div class="door" id="door">  

        <div class="door-text">  
            🚪<br>  
            OPEN FOR A SURPRISE ❤️  
        </div>  

        <div class="knob"></div>  

    </div>  

</div>  

<button class="open-btn" id="openBtn">  
    🚪 किवाड़ खोलें ❤️  
</button>

</div>  <script>  
  
const door = document.getElementById("door");  
const message = document.getElementById("message");  
const button = document.getElementById("openBtn");  
const music = document.getElementById("music");  
const knife = document.getElementById("knife");  
  
button.addEventListener("click", function(){  
  
    /* Open Door */  
    door.classList.add("open");  
  
    /* Start Music */  
    music.play().catch(()=>{});  
  
    /* Show Birthday */  
    setTimeout(()=>{  
        message.classList.add("show");  
        button.style.display="none";  
    },1300);  
  
    /* Cake Cutting */  
    setTimeout(()=>{  
        knife.classList.add("cut");  
    },3500);  
  
    /* Confetti */  
    setTimeout(()=>{  
        createConfetti();  
        createHearts();  
    },1800);  
  
});  
  
  
function createConfetti(){  
  
    for(let i=0;i<100;i++){  
  
        const confetti=document.createElement("div");  
  
        confetti.className="confetti";  
  
        confetti.style.left=Math.random()*100+"vw";  
  
        confetti.style.animationDuration=  
            (2+Math.random()*4)+"s";  
  
        confetti.style.background=  
            ["#ff1493","#ffd700","#00ffff","#7fff00","#ffffff"]  
            [Math.floor(Math.random()*5)];  
  
        confetti.style.transform=  
            "rotate("+Math.random()*360+"deg)";  
  
        document.body.appendChild(confetti);  
  
        setTimeout(()=>{  
            confetti.remove();  
        },6000);  
    }  
}  
  
  
function createHearts(){  
  
    for(let i=0;i<25;i++){  
  
        const heart=document.createElement("div");  
  
        heart.className="heart";  
        heart.innerHTML="❤️";  
  
        heart.style.left=Math.random()*100+"vw";  
        heart.style.animationDuration=  
            (4+Math.random()*4)+"s";  
  
        heart.style.animationDelay=  
            Math.random()*3+"s";  
  
        document.body.appendChild(heart);  
  
        setTimeout(()=>{  
            heart.remove();  
        },9000);  
    }  
}  
  
</script>  </body>  
</html>   Is code ko run kar
